name: Build SiYuan Unlock release (fork)

# Manual builds only: upstream releases can require patch updates.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream SiYuan tag (for example v3.8.10)"
        required: true
        default: v3.8.10
        type: string

permissions:
  contents: write
  actions: write

jobs:
  create_release:
    name: Create fork release and start platform builds
    runs-on: ubuntu-latest
    steps:
      - name: Verify target and upstream version
        id: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "SmallDS/siyuan-unlock" ]]; then
            echo "::error::This workflow only publishes to SmallDS/siyuan-unlock"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable tag such as v3.8.10"
            exit 1
          fi
          package_json="$(curl --fail --silent --show-error --location "https://raw.githubusercontent.com/siyuan-note/siyuan/${VERSION}/app/package.json")"
          upstream_version="$(jq -er '.version' <<< "$package_json")"
          test "$upstream_version" = "${VERSION#v}" || { echo "::error::Upstream version mismatch"; exit 1; }
          package_manager="$(jq -er '.packageManager' <<< "$package_json")"
          echo "package_manager=${package_manager}" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists in this fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target master --title "$VERSION" --notes "Fork build from upstream SiYuan $VERSION"
          fi

      - name: Dispatch desktop, Android and iOS builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PACKAGE_MANAGER: ${{ steps.source.outputs.package_manager }}
        run: |
          set -euo pipefail
          gh workflow run desktop-release.yml --repo "$GITHUB_REPOSITORY" --ref master -f version="$VERSION" -f packageManager="$PACKAGE_MANAGER"
          gh workflow run release-android.yml --repo "$GITHUB_REPOSITORY" --ref master -f version="$VERSION" -f packageManager="$PACKAGE_MANAGER"
          gh workflow run release-ios.yml --repo "$GITHUB_REPOSITORY" --ref master -f version="$VERSION" -f packageManager="$PACKAGE_MANAGER"
